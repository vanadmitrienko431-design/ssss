<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shina Tracker</title>
<meta name="theme-color" content="#0f1011">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shina Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1011;--panel:#18191b;--panel2:#202225;--line:rgba(255,255,255,.1);--txt:#f2f3f4;--mut:#8b9096;--acc:#4be07a;
--l0:#15231c;--l1:#1c4430;--l2:#237040;--l3:#2fa352;--l4:#4be07a;--r1:#7a2a2e;--r2:#b23440;--r3:#e5484d;--btn:#fff;--btnt:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0f1011}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.45 "Onest",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;padding:0 8px 16px}
.logo i{width:22px;height:22px;border-radius:7px;background:var(--acc);display:block}
.sec{font-size:11px;color:var(--mut);padding:14px 10px 6px;font-weight:600}
.m{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-radius:12px;color:#c6c9cd}
.m:hover{background:var(--panel)}
.m.on{background:var(--panel2);color:#fff}
.m .d{width:10px;height:10px;border-radius:3px;background:var(--c)}
.m small{margin-left:auto;color:var(--mut)}
main{padding:20px 28px 40px;min-width:0;max-width:980px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-size:22px;font-weight:700;text-transform:capitalize}
.sp{flex:1}
.ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel)}
.ic:hover{background:var(--panel2)}
.pill{height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.pill.w{background:var(--btn);color:var(--btnt);font-weight:600;border-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:20px;font-weight:700}
.stat span{color:var(--mut);font-size:12px}
.wd,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{color:var(--mut);font-size:12px;margin-bottom:6px;text-align:center}
.cell{aspect-ratio:1;min-height:44px;border-radius:12px;border:2px solid transparent;display:flex;flex-direction:column;justify-content:space-between;padding:6px 8px;background:var(--l0);text-align:left}
.cell .n{font-size:12px;opacity:.85}
.cell .v{font-size:12px;font-weight:600;align-self:flex-end}
.cell{cursor:default}
.sel{height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:0 10px;font:inherit}
.row{display:grid;grid-template-columns:26px 1fr 70px 56px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.row.h{color:var(--mut);font-size:12px}.row span:nth-child(n+3){text-align:right}
.badge{border-radius:8px;padding:2px 7px;font-weight:600;display:inline-block}
.streak{display:none;align-items:center;gap:16px;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 18px;flex-wrap:wrap}
.streak svg{width:56px;height:56px;flex:none}
.streak.lit svg{animation:fl 2.4s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 0 10px rgba(255,120,30,.5))}
@keyframes fl{0%,100%{transform:scale(1) rotate(-1.5deg)}50%{transform:scale(1.06) rotate(1.5deg)}}
@media (prefers-reduced-motion:reduce){.streak.lit svg{animation:none}}
.streak .num{font-size:32px;font-weight:700;line-height:1.05}
.streak .sub{color:var(--mut);font-size:12px;margin-top:3px}
.dots{margin-left:auto;display:flex;gap:6px}
.dots i{width:16px;height:16px;border-radius:5px;background:var(--l0)}
.dots i.t{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.cell.e{visibility:hidden}
.cell.f{opacity:.45}
.cell[data-l="1"]{background:var(--l1)}.cell[data-l="2"]{background:var(--l2)}.cell[data-l="3"]{background:var(--l3);color:#06210f}.cell[data-l="4"]{background:var(--l4);color:#06210f}
.cell[data-l="-1"]{background:var(--r1);color:#fff}.cell[data-l="-2"]{background:var(--r2);color:#fff}.cell[data-l="-3"]{background:var(--r3);color:#fff}
.age{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);color:var(--mut)}
.age input{width:72px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:0 10px;font:inherit;text-align:center}
.age b{color:var(--txt)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.dp{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px}.dp label{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:12px}
.dp input{width:120px;height:34px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:0 10px;font:inherit}
.rk{font-size:20px;font-weight:700}.fc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}.fc div{background:var(--panel2);border-radius:12px;padding:8px 10px}.fc b{display:block}
.note{color:var(--mut);font-size:12px;margin-top:12px}
@media (max-width:760px){.fc{grid-template-columns:repeat(2,1fr)}}
.cell.sel{border-color:#fff}
.cell.td .n{font-weight:700;text-decoration:underline}
.legend{display:flex;align-items:center;gap:5px;margin-top:14px;color:var(--mut);font-size:12px}
.legend i{width:14px;height:14px;border-radius:4px}
.edit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.edit .lbl{flex:1;min-width:160px}
.edit .lbl b{display:block;font-size:15px}
.edit .lbl span{color:var(--mut);font-size:12px}
.edit input{width:90px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:0 12px;font:inherit;text-align:center}
.tg{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:12px}
@media (max-width:760px){
.app{grid-template-columns:1fr}
aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px;gap:6px}
.logo,.sec{display:none}
.m{width:auto;white-space:nowrap}.m small{display:none}
main{padding:16px 14px 32px}
.stats{grid-template-columns:repeat(2,1fr)}
.cell{padding:4px 5px;min-height:40px;border-radius:9px}
.cell .v{font-size:10px}
}

/* ---- skin v2 ---- */
:root{--bg:#0b0c14;--panel:rgba(255,255,255,.05);--panel2:rgba(255,255,255,.09);--line:rgba(255,255,255,.09);--mut:#9096ab;--l0:rgba(255,255,255,.05);--acc:#a78bfa;--l1:#2a2250;--l2:#4a3a9e;--l3:#9b82ff;--l4:#c4b5fd;--lt:#1a1033}
html[data-ac="emerald"]{--acc:#4be07a;--l1:#1c4430;--l2:#237040;--l3:#2fa352;--l4:#4be07a;--lt:#06210f}
html[data-ac="sunset"]{--acc:#ff9f5a;--l1:#3a2216;--l2:#8a4a1f;--l3:#f08a3c;--l4:#ffc15e;--lt:#2b1604}
body{background:radial-gradient(1100px 560px at 8% -10%,rgba(124,92,255,.22),transparent 60%),radial-gradient(900px 480px at 100% 0,rgba(45,212,191,.13),transparent 55%),var(--bg);background-attachment:fixed;min-height:100vh}
aside{background:rgba(255,255,255,.025);backdrop-filter:blur(14px)}
.logo{font-size:16px;letter-spacing:.2px}
.logo i{background:linear-gradient(135deg,var(--acc),#5eead4);box-shadow:0 0 18px var(--acc)}
.m{transition:background .15s,transform .15s}.m:hover{transform:translateX(2px)}
.m.on{background:linear-gradient(90deg,var(--panel2),transparent);box-shadow:inset 3px 0 0 var(--acc)}
.card,.stat,.streak{background:var(--panel);backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.25);border-radius:20px}
.stat b{background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.top h1{background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill.w{background:linear-gradient(135deg,var(--acc),#5eead4);color:#0d0d14;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.ic,.pill{transition:transform .12s,background .15s}.ic:active,.pill:active{transform:scale(.94)}
.cell{border-radius:14px;transition:transform .12s,box-shadow .2s}
.cell:not(.e):not(.f){cursor:pointer}.cell:not(.e):not(.f):hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.cell[data-l="3"],.cell[data-l="4"]{color:var(--lt)}
.cell.sel{height:auto;padding:6px 8px;border:2px solid #fff;border-radius:14px;box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.cell.td .n{text-decoration:none;background:var(--acc);color:var(--lt);border-radius:6px;padding:0 5px;align-self:flex-start}
.bar i{background:linear-gradient(90deg,var(--acc),#5eead4)}
#cfg textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:8px 10px;font:12px/1.4 ui-monospace,monospace;resize:vertical}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.sw button{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.sw button::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--a)}
.sw button.on{border-color:var(--a);box-shadow:0 0 0 2px var(--a) inset}

/* ---- v3 ---- */
#home textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);padding:8px 10px;font:inherit;resize:vertical}
#home h2{margin:0 0 2px;font-size:22px}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:16px 0}
.rw{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:3px}
.rw:hover{background:var(--panel)}.rw small{color:var(--mut);font-size:11px}
.ring{width:80px;height:80px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.08) 0);display:grid;place-items:center}
.ring::before{content:"";grid-area:1/1;width:62px;height:62px;border-radius:50%;background:#12131c}
.ring b{grid-area:1/1;z-index:1;font-size:15px}.ring.ok{box-shadow:0 0 18px var(--c)}
.wk{display:grid;grid-template-columns:84px 1fr 52px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.wk small{color:var(--mut);text-align:right}
.bars{display:flex;gap:5px;align-items:flex-end;height:34px}.bars i{flex:1;background:var(--c);border-radius:4px;min-height:3px}.bars i.z{opacity:.2}
.cr{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.cr span{flex:1}

/* ---- v4 ---- */
.ring::before{background:var(--bg2,#12131c)}
html[data-th="light"]{--bg:#f3f4fb;--bg2:#fff;--panel:rgba(255,255,255,.82);--panel2:rgba(25,25,60,.07);--line:rgba(25,25,60,.12);--txt:#14151f;--mut:#66697e;--l0:rgba(25,25,60,.07);color-scheme:light}
html[data-th="light"] .m{color:#444a63}html[data-th="light"] .m.on{color:#000}
html[data-th="light"] .stat b,html[data-th="light"] .top h1{background-image:linear-gradient(90deg,#14151f,var(--acc))}
html[data-th="light"] .cell.sel{border-color:#14151f}html[data-th="light"] .ring{background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(25,25,60,.1) 0)}
.rw{position:relative}.q{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--lt);font-weight:700;display:grid;place-items:center;line-height:1}
.ygrid{display:grid;grid-template-rows:repeat(7,1fr);grid-template-columns:repeat(53,1fr);grid-auto-flow:column;gap:3px;margin-top:10px}
.ygrid i{aspect-ratio:1;border-radius:3px;background:var(--l0)}
.ygrid i[data-l="1"]{background:var(--l1)}.ygrid i[data-l="2"]{background:var(--l2)}.ygrid i[data-l="3"]{background:var(--l3)}.ygrid i[data-l="4"]{background:var(--l4)}
.wdb{display:flex;gap:8px;align-items:flex-end;height:70px;margin-top:12px}.wdb div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.wdb i{display:block;background:var(--acc);border-radius:5px;margin-bottom:3px;min-height:3px}
.moods{display:flex;gap:8px;margin:6px 0}.mo{font-size:24px;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel2)}.mo.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.ms{font-size:16px;letter-spacing:2px}
.pomo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.pomo b{font-size:28px;min-width:90px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.ach div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;font-size:12px;color:var(--mut)}
.ach div b{display:block;color:var(--txt);font-size:13px}.ach div.lk{opacity:.4;filter:grayscale(1)}.ach div.ok{border-color:var(--acc)}
.xp{display:flex;align-items:center;gap:10px;margin:4px 0}.xp b{white-space:nowrap}.xp .bar{flex:1;margin:0}
.lk2{display:none;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lk2 input{width:160px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);text-align:center;font:inherit;font-size:20px}
.qt{color:var(--mut);font-style:italic;margin-top:14px}
</style>
</head>
<body>
<div class="lk2" id="lock"><b style="font-size:20px">Shina Tracker</b><input id="lkp" type="password" inputmode="numeric" placeholder="PIN" aria-label="PIN"><button class="pill w" id="lkb">Войти</button><div class="note" id="lkm"></div></div>
<div class="app">
<aside id="side"></aside>
<main>
<div class="top" id="top">
<button class="ic" id="prev" aria-label="Предыдущий месяц">‹</button>
<h1 id="title"></h1>
<button class="ic" id="next" aria-label="Следующий месяц">›</button>
<div class="sp"></div>
<button class="pill" id="today">Сегодня</button>
</div>
<div class="streak" id="streak"></div>
<div class="stats" id="stats"></div>
<div class="card" id="cal">
<div class="wd"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
<div class="grid" id="grid"></div>
<div class="legend"><span>Меньше</span><i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i><span>Цель выполнена</span><span style="margin-left:12px">Сон:</span><i style="background:hsl(0,68%,40%)"></i><i style="background:hsl(35,68%,44%)"></i><i style="background:hsl(70,68%,48%)"></i><i style="background:hsl(105,68%,52%)"></i><i style="background:hsl(140,68%,55%)"></i><span>от 2 ч до нормы</span></div>
<div class="edit" id="edit">
<div class="lbl"><b id="edDate"></b><span id="edGoal"></span></div>
<button class="ic" id="minus" aria-label="Меньше">−</button>
<input id="inp" type="number" min="0" step="0.5" inputmode="decimal" aria-label="Значение">
<button class="ic" id="plus" aria-label="Больше">+</button>
<button class="pill w" id="save">Сохранить</button>
</div>
<div class="edit" id="dedit" style="display:none">
<div class="lbl"><b id="dDate"></b><span id="dSum"></span></div>
<button class="ic" id="wm" aria-label="Убрать победу" title="Убрать победу">−</button>
<button class="pill w" id="wp">Победа +1</button>
<button class="pill" id="lp">Поражение +1</button>
<button class="ic" id="lm" aria-label="Убрать поражение" title="Убрать поражение">−</button>
</div>
<div class="age" id="agebox"><label for="age">Ваш возраст</label><input id="age" type="number" min="1" max="120" inputmode="numeric"><span id="norm"></span></div>
</div>
<div class="card" id="yr" style="margin-top:14px;display:none"></div>
<div class="card" id="dpanel" style="margin-top:14px;display:none"></div>
<div class="card" id="meta" style="display:none"></div>
<div class="card" id="home" style="display:none"></div>
<div class="card" id="cfg" style="margin-top:14px"><b>Оформление</b>
<div class="sw" id="sw"><button data-ac="violet" style="--a:#a78bfa">Фиолет</button><button data-ac="emerald" style="--a:#4be07a">Изумруд</button><button data-ac="sunset" style="--a:#ff9f5a">Закат</button></div>
<div class="sw" id="th"><button data-th="dark" style="--a:#222">Тёмная тема</button><button data-th="light" style="--a:#ddd">Светлая тема</button></div>
<b style="display:block;margin-top:18px">Цели</b><div class="dp" id="gl" style="margin-top:8px"></div>
<b style="display:block;margin-top:18px">PIN-код</b><div class="edit" style="margin-top:6px"><input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" style="width:110px"><button class="pill" id="pins">Установить</button><button class="pill" id="pinr">Убрать</button></div><div class="note" style="margin-top:4px">Защита от посторонних глаз, не шифрование.</div>
<b style="display:block;margin-top:18px">Свои трекеры</b>
<div class="dp" style="margin-top:8px"><label>Название<input id="cn" type="text" maxlength="20" style="width:140px"></label><label>Единица<input id="cu" type="text" maxlength="6" placeholder="раз" style="width:70px"></label><label>Цель в день<input id="cg" type="number" min="1" value="1" style="width:84px"></label><label>Шаг<input id="cs" type="number" min="0.5" step="0.5" value="1" style="width:70px"></label><label>Цвет<input id="cc" type="color" value="#ff7ab6" style="width:54px;padding:2px"></label></div>
<div class="edit" style="margin-top:0"><button class="pill w" id="ca">Добавить трекер</button></div><div id="cl"></div>
<div id="remb" style="display:none"><b style="display:block;margin-top:18px">Напоминание</b><div class="edit"><input id="remt" type="time" value="21:00" style="width:110px"><button class="pill w" id="remon">Включить</button><button class="pill" id="remoff">Выключить</button></div><div class="note" id="remm"></div></div>
<b style="display:block;margin-top:18px">Резервная копия</b>
<div class="note" style="margin:4px 0 8px">Скопируйте данные в надёжное место или вставьте сохранённые, чтобы перенести их на другое устройство.</div>
<textarea id="bk" rows="3" aria-label="Данные для резервной копии"></textarea>
<div class="edit"><button class="pill" id="bkc">Копировать данные</button><button class="pill" id="bki">Загрузить из поля</button></div>
<div class="note" id="bkm"></div></div>
</main>
</div>
<script>
var M=[
{id:"sleep",name:"Сон",unit:"ч",goal:8,step:0.5,c:"#7aa7ff"},
{id:"water",name:"Вода",unit:"ст.",goal:8,step:1,c:"#4cc9f0"},
